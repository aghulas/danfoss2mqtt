services:
  danfoss2mqtt:
    build:
      context: ./danfoss2mqtt
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["danfoss2mqtt"]
    environment:
      DANFOSS_MQTT_HOST: "${DANFOSS_MQTT_HOST:-mosquitto}"
      DANFOSS_MQTT_PORT: "${DANFOSS_MQTT_PORT:-1883}"
      DANFOSS_MQTT_USERNAME: "${DANFOSS_MQTT_USERNAME:-}"
      DANFOSS_MQTT_PASSWORD: "${DANFOSS_MQTT_PASSWORD:-}"
      DANFOSS_BASE_TOPIC: "${DANFOSS_BASE_TOPIC:-danfoss2mqtt}"
      DANFOSS_USERNAME: "${DANFOSS_USERNAME}"
      DANFOSS_PASSWORD: "${DANFOSS_PASSWORD}"
      DANFOSS_COUNTRY_CODE: "${DANFOSS_COUNTRY_CODE:-33}"
      DANFOSS_REGION: "${DANFOSS_REGION:-eu}"
      DANFOSS_SIGN_KEY: "${DANFOSS_SIGN_KEY}"
      DANFOSS_DEVICE_ID: "${DANFOSS_DEVICE_ID}"
      DANFOSS_CH_KEY: "${DANFOSS_CH_KEY}"
      DANFOSS_POLL_INTERVAL: "${DANFOSS_POLL_INTERVAL:-60}"
