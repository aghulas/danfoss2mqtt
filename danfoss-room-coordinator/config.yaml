name: "Danfoss Room Coordinator"
version: "0.1.0"
slug: "danfoss_room_coordinator"
description: "Standalone room coordinator daemon for Zigbee2MQTT Danfoss heads (virtual rooms, setpoints, heat demand)."
url: "https://github.com/aghulas/danfoss2mqtt"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
services:
  - mqtt:want
options:
  source_prefix: "zigbee2mqtt"
  base_topic: "danfoss_rooms"
  store_path: "/data/rooms.json"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  heat_demand_valid_s: 3600
  armed_rooms: []
  setpoint_timeout_s: 30.0
  setpoint_retries: 2
schema:
  source_prefix: str
  base_topic: str
  store_path: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  heat_demand_valid_s: int(60,86400)?
  armed_rooms:
    - str
  setpoint_timeout_s: float(5.0,120.0)?
  setpoint_retries: int(0,5)?
