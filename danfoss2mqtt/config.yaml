name: "danfoss2mqtt"
version: "0.1.6"
slug: "danfoss2mqtt"
description: "Standalone Danfoss Ally Cloud -> Mosquitto bridge speaking the Zigbee2MQTT dialect for Danfoss Companion v2."
url: "https://github.com/aghulas/danfoss2mqtt"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
services:
  - mqtt:want
options:
  base_topic: "danfoss2mqtt"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  username: ""
  password: ""
  country_code: "33"
  region: "eu"
  sign_key: ""
  device_id: ""
  ch_key: ""
  poll_interval: 60
  cloud_mqtt_listen: false
  head_settings_writes: false
  head_settings_trial_head: ""
schema:
  base_topic: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  username: str
  password: password
  country_code: str
  region: list(eu|us|cn|in)
  sign_key: password
  device_id: password?
  ch_key: password
  poll_interval: int(15,600)
  cloud_mqtt_listen: bool?
  head_settings_writes: bool?
  head_settings_trial_head: str?
